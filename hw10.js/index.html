<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Работа с DOM</title>
    <style>
    .description {
        border: 1px dashed blue;
        padding: 5px;
        margin-bottom: 5px;
    }
    h1 {
        color: black;
    }
    </style>
</head>
<body>

    <!-- Задание 1: Скрытие и показ текста -->
    <h1 id="heading1">Заголовок для Задания 1</h1>
    <button id="toggleButton1">Скрыть</button>
    <hr>

    <!-- Задание 2: Изменение стиля -->
    <p id="myParagraph2">Этот текст будет изменен.</p>
    <button id="changeColorButton2">Изменить цвет текста</button>
    <hr>

    <!-- Задание 3: Изменение текста -->
    <h1 id="myHeading3">Исходный текст заголовка</h1>
    <button id="changeTextButton3">Изменить текст заголовка</button>
    <hr>
    
    <!-- Задание 4: Поиск и изменение элементов по классу -->
    <div id="task4-container">
        <p class="description">Текст 1 для Задания 4</p>
        <p class="description">Текст 2 для Задания 4</p>
        <p>Этот текст НЕ имеет класса description.</p>
        <p class="description">Текст 3 для Задания 4</p>
    </div>
    <hr>

    <!-- Задание 5: Работа с querySelectorAll -->
    <div id="task5-container">
        <p class="description">Абзац 1 с классом description</p>
        <p>Обычный абзац</p>
        <p class="description">Абзац 2 с классом description</p>
        <p class="other-class">Абзац с другим классом</p>
    </div>
    <hr>

    <!-- Задание 6: Добавление нового элемента в DOM -->
    <button id="addElementButton6">Добавить элемент</button>
    <div id="container6">
        <!-- Сюда будут добавляться новые элементы -->
    </div>
    <hr>

    <script src="script.js"></script>
</body>
</html>
